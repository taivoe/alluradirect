        thumbnail:
          type: string

    User.GuestProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
      required:
        - member_since
        - permissions
        - num_bookings
        - num_recommendations
        - num_reviews
      properties:
        member_since:
          type: string
          format: date
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/User.GuestProfile.Permission"
        num_bookings:
          type: integer
        num_recommendations:
          type: integer
        num_reviews:
          type: integer

    User.GuestProfile.Permission:
      type: object
      required:
        - show_num_reviews
        - show_member_since
        - show_num_recommendations
      properties:
        show_num_reviews:
          type: boolean
        show_member_since:
          type: boolean
        show_num_recommendations:
          type: boolean

    User.Owner:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
      required:
        - address
        - company_name
        - is_company
        - is_non_resident
        - thumbnail
      properties:
        address:
          $ref: "#/components/schemas/Address"
        company_name:
          type: string
        is_company:
          type: boolean
        is_non_resident:
          type: boolean
        thumbnail:
          type: string

    User.Owner.SetupQuestions:
      required:
        - id
        - num_properties
        - platform_ids
      properties:
        id:
          type: integer
        num_properties:
          type: integer
        platform_ids:
          type: array
          items:
            $ref: "#/components/schemas/User.Owner.SetupQuestions.PlatformId"

    User.Owner.SetupQuestions.PlatformId:
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    User.OwnerProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
      required:
        - member_since
        - property_ids
        - property_ids_enabled
      properties:
        member_since:
          type: string
          format: date
        property_ids:
          type: array
          items:
            type: integer
        property_ids_enabled:
          type: array
          items:
            type: integer

    User.Titleholder:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
      required:
        - address
        - dob
        - is_non_resident
        - sin_number
      properties:
        address:
          $ref: "#/components/schemas/Address"
        dob:
          type: string
          format: date
        is_non_resident:
          type: boolean
          default: false
        sin_number:
          type: string

    User.Role:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: integer
        role:
          type: string
          pattern: "^(Owner|Guest)$"

            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /user/message/subjects/:
    get:
      summary: get a user's previous contacts from inquiries and bookings (from last 15 months per CASL rules) ordered by arrivals, then recent departures, then inquiries
      operationId: getUserMessageSubjects
      tags:
        - user
      parameters:
        - name: id
          in: query
          description: user id of message sender
          required: true
          schema:
            type: integer
        - name: user_type_id
          in: query
          description: user type id of message sender; Enum type where 2 = Owner, 3 = Guest
          required: true
          schema:
            type: integer
            pattern: "(2|3)"
        - name: page_direction
          in: query
          description: future or past bookings; if blank or not provided, defaults to 'future' and loads ALL future bookings (no pagination)
          required: true
          schema:
            type: string
            pattern: (future|past)
        - name: amount_per_page
          in: query
          description: number of records per page, more than zero
          required: true
          schema:
            type: integer
        - name: page
          in: query
          description: pagination page, start at 1 and increment
          required: true
          schema:
            type: integer
        - name: search_filter
          in: query
          description: look at guest name and email to filter out contact matches
          required: false
          schema:
            type: string
        - name: filter_user_id
          in: query
          description: only return messages from this user id (must be submitted with filter_user_type_id)
          required: false
          schema:
            type: integer
        - name: filter_user_type_id
          in: query
          description: only return messages from this user type id (must be submitted with filter_user_id); Enum type where 2 = Owner, 3 = Guest
          required: false
          schema:
            type: integer
            pattern: "(2|3)"
        - name: subject_type
          in: query
          description: only return messages from past or future bookings or inquiries
          required: true
          schema:
            type: string
            pattern: "(past_bookings|future_bookings|inquiries)"
      responses:
        200:
          description: >-
            returns JSON object with array of Message.Contacts DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"


# can view in online editor: https://editor.swagger.io/
openapi: "3.0.0"
info:
  version: 1.0.0
  title: Owner Admin Dashboard
  description: <strong>Usage Notes:</strong>
    <ul>
    <li>Use of API requires authenication, send email for more information</li>
    <li><i>Requests for property managers must include a valid <b>property_manager_id</b></i></li>
    <li>All dates in format yyyy-mm-dd</li>
    </ul>
  contact:
    name: "alluraDirect Dashboard API"
    url: "https://www.alluradirect.com/api"
    email: "web_administrator@alluradirect.com"
  license:
    name: Commerical
servers:
  - url: https://taivo.allura.local/RESTAUTH/v1

paths:

  /admin/offer/:
    get:
      summary: get Admin Offer
      operationId: getAdminOffer
      tags:
        - admin
      parameters:
        - name: id
          in: query
          description: admin user id
          required: true
          schema:
            type: integer
        - name: offer_id
          in: query
          description: offer id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: >-
            returns JSON with a Rates.Offer.Admin in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
    delete:
      summary: delete an Admin Offer
      operationId: deleteAdminOffer
      tags:
        - admin
      parameters:
        - name: id
          in: query
          description: admin user id
          required: true
          schema:
            type: integer
        - name: offer_id
          in: query
          description: offer id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: >-
            returns JSON with success or error message in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
    put:
      summary: create or save an Admin-created Offer
      operationId: saveAdminOffer
      tags:
        - admin
      parameters:
        - name: user_id
          in: query
          description: admin user id
          required: true
          schema:
            type: integer
        - name: offer_id
          in: query
          description: offer id, use 0 to create a new offer
          required: true
          schema:
            type: integer
        - name: offer_availability_id
          in: query
          description: offer availability id - allguests 1, repeatguests 2, specificguest 3
          required: true
          schema:
            type: integer
        - name: offer_type_id
          in: query
          description: offer type id, - percentage 1, dollar 2, freenights 3
          required: true
          schema:
            type: integer
        - name: is_all_properties
          in: query
          description: whether this is an allura-only offer or one we invite Owners to join
          required: true
          schema:
            type: boolean
        - name: is_enabled
          in: query
          description: whether this is offer is enabled or not
          required: true
          schema:
            type: boolean
        - name: is_promoted
          in: query
          description: whether this is an allura-only offer or one we invite Owners to join
          required: true
          schema:
            type: boolean
        - name: is_public
          in: query
          description: whether this is an allura-only offer or one we invite Owners to join
          required: true
          schema:
            type: boolean

        - name: guest_email
          in: query
          description: guest email, to restrict offer to a single guest; required only if offer_availability_id==3 specific guest
          required: false
          schema:
            type: string
        - name: development_id
          in: query
          description: if provided and > 0, restrict Offer to properties in this development
          required: false
          schema:
            type: integer
        - name: resort_id
          in: query
          description: if provided and > 0, restrict Offer to properties in this resort
          required: false
          schema:
            type: integer
        - name: dollar
          in: query
          description: required if offer_type_id==2 dollar
          required: false
          schema:
            type: integer
        - name: nights_free
          in: query
          description: required if offer_type_id==3 freenights
          required: false
          schema:
            type: integer
        - name: nights_required
          in: query
          description: required if offer_type_id==3 freenights
          required: false
          schema:
            type: integer
        - name: percentage
          in: query
          description: required if offer_type_id==1 percentage
          required: false
          schema:
            type: integer
        - name: offer_start
          in: query
          description: date on or after which offer booking can start to be eligible for offer, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_end
          in: query
          description: date on or before which booking must end to be eligible for offer, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_available_start
          in: query
          description: date on or after which an offer is visible to guests, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_available_end
          in: query
          description: date on or before which an offer is visible to guests, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: amenity_ids
          in: query
          description: if provided, will restrict Offer to these amenities; comma-separated list of integers
          required: false
          schema:
            type: string
        - name: blackout_periods
          in: query
          description: if provided, will restrict Offer availability; submit array of [{start:'<date>',end:'<date>',...}] with dates in yyyy-mm-dd format
          required: false
          schema:
            type: string
        - name: suitability_ids
          in: query
          description: if provided, will restrict Offer to these suitabilities; comma-separated list of integers
          required: false
          schema:
            type: string
        - name: offer_url
          in: query
          description: if provided, a URL where guests can view offer details
          required: false
          schema:
            type: string
        - name: description
          in: query
          description: if provided, will persist gift certification redemption description, note this field will publicly visible
          required: false
          schema:
            type: string
        - name: instructions
          in: query
          description: if provided, will persist gift certification redemption instructions, note this field will be private and only viewed by eligible guests
          required: false
          schema:
            type: string
        - name: max_usage_count
          in: query
          description: if provided, this offer will only be claimable by this number of guests
          required: false
          schema:
            type: integer
        - name: distribution_id
          in: query
          description: required for gift certificate type, sets when offer details/voucher will be delivered by email
          required: false
          schema:
            type: integer
        - name: gift_certificate_url
          in: query
          description: file attachment object in base64, if uploaded
          required: false
          schema:
            type: string
      responses:
        200:
          description: >-
            returns JSON object with array of Rates.Offer.Allura in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /admin/offer/upload/:
    post:
      summary: upload an Admin Gift Certificate pdf
      operationId: uploadAdminOfferPDF
      tags:
        - admin
      parameters:
        - name: id
          in: query
          description: admin user id
          required: true
          schema:
            type: integer
        - name: offer_id
          in: query
          description: offer id
          required: true
          schema:
            type: integer
        - name: file
          in: query
          description: pdf file content in Base64
          required: true
          schema:
            type: string
            format: Base64
      responses:
        200:
          description: >-
            returns JSON with Rates.Offer.Owner in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"


  /admin/offers/:
    get:
      summary: get Admin Offers
      operationId: getAdminOffers
      tags:
        - admin
      parameters:
        - name: id
          in: query
          description: admin user id
          required: true
          schema:
            type: integer
        - name: is_enabled
          in: query
          description: if not supplied, returns both enabled and disabled offers
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: >-
            returns JSON with array of Rates.Offer.Admin in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /app/version/:
    get:
      summary: get mobile app version to determine if update required
      operationId: getAppVersion
      tags:
        - app
      parameters:
        - name: platform
          in: query
          description: mobile device platform (ios|android)
          required: true
          schema:
            type: string
        - name: build_number
          in: query
          description: the installed build number of the mobile app
          required: false
          schema:
            type: string
        - name: version
          in: query
          description: the installed versionof the mobile app
          required: false
          schema:
            type: string 
      responses:
        200:
          description: >-
            returns JSON object with IS_UPDATE_REQUIRED boolean in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /booking/:
    get:
      summary: get booking data
      operationId: bookingRead
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: id of booking
          required: true
          schema:
            type: integer
        - name: include_timeline
          in: query
          description: optional boolean to pull booking timeline array
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: >-
            returns JSON object with Booking object in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

    post:
      summary: create new Booking
      operationId: bookingCreate
      tags:
        - booking
      parameters:
        - name: arrival
          in: query
          description: arrival date of booking
          required: true
          schema:
            type: string
            format: date
        - name: balance_due_date
          in: query
          description: balance due date of booking
          required: true
          schema:
            type: string
            format: date
        - name: booking_net
          in: query
          description: net booking amount before taxes and fees
          required: true
          schema:
            type: number
            format: double
        - name: damage_deposit_amount
          in: query
          description: damage deposit amount to collect
          required: false
          schema:
            type: integer
            default: 0
        - name: damage_deposit_mode_id
          in: query
          description: >-
            integer representing damage deposit setting to apply [0-4]<br>
            0 - no damage deposit required<br>
            1 - charge separately before arrival<br>
            2 - collect with deposit payment<br>
            3 - collect with balance payment<br>
            4 - upon departure if property is damaged
          required: false
          schema:
            type: integer
            default: 4
        - name: deposit_percentage
          in: query
          description: percentage of net booking amount required for deposit
          required: true
          schema:
            type: integer
        - name: deposit_due_date
          in: query
          description: deposit due date of booking
          required: true
          schema:
            type: string
            format: date
        - name: guest_id
          in: query
          description: guest_id, will be used if supplied and greater than zero before guest_email 
          required: false
          schema:
            type: integer
        - name: guest_email
          in: query
          description: guest email address
          required: true
          schema:
            type: string
        - name: guest_first_name
          in: query
          description: guest first name
          required: false
          schema:
            type: string
        - name: guest_last_name
          in: query
          description: guest last name
          required: false
          schema:
            type: string
        - name: guest_phone
          in: query
          description: guest phone
          required: false
          schema:
            type: string
        - name: is_direct_vacations
          in: query
          description: whether a DirectVacations or alluraDirect booking
          required: false
          schema:
            type: boolean
            default: false
        - name: nights
          in: query
          description: number of nights of booking
          required: true
          schema:
            type: integer
        - name: notes_owner
          in: query
          description: notes from owner
          required: true
          schema:
            type: string
            maxLength: 1000
        - name: party_size_adults
          in: query
          description: number of guests excluding children
          required: true
          schema:
            type: integer
        - name: party_size_kids
          in: query
          description: number of child guests excluding adults
          required: true
          schema:
            type: integer
        - name: property_id
          in: query
          description: property id of booking
          required: true
          schema:
            type: integer
        - name: surcharge_ids
          in: query
          description: include ids to add cleaning fees [surcharge_ids=1] and/or pet fees [surcharge_ids=2]
          required: false
          schema:
            type: string
            default: ""
        - name: surcharge_amount_cleaning
          in: query
          description: cleaning surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: surcharge_amount_pets
          in: query
          description: pet surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: is_temporary
          in: query
          description: create a temporary status booking to block dates, is deleted and dates unblocked within 15 minutes if not followed by PUT updating this booking, which will automatically make this into a full booking; if false booking status will be deposit due and block dates on the property calendar; default is false
          required: false
          schema:
            type: boolean
        - name: marketing_emails
          in: query
          description: guest opt-in for marketing emails; default is false
          required: false
          schema:
            type: boolean

        - name: allura_offer_id
          in: query
          description: allura offers section offer id, to access Allura offer
          required: false
          schema:
            type: integer
        - name: allura_offer_code
          in: query
          description: allura offer code, to access Allura private offer
          required: false
          schema:
            type: string
        - name: owner_offer_id
          in: query
          description: owner offers section offer id, to access Owner offer
          required: false
          schema:
            type: integer
        - name: owner_offer_code
          in: query
          description: owner offer code, to access Owner private offer
          required: false
          schema:
            type: string
        - name: owner_gift_certificate_id
          in: query
          description: owner gift certificates section id, to access Owner Gift Certificate
          required: false
          schema:
            type: integer
        - name: owner_gift_certificate_code
          in: query
          description: owner gift certificate code, to access Owner private Gift Certificate
          required: false
          schema:
            type: string
        - name: allura_gift_certificate_id
          in: query
          description: allura gift certificates section id, to access allura Gift Certificate
          required: false
          schema:
            type: integer
        - name: allura_gift_certificate_code
          in: query
          description: allura gift certificate code, to access allura private Gift Certificate
          required: false
          schema:
            type: string

      responses:
        200:
          description: >-
            returns JSON object with Booking object in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

    put:
      summary: update existing Booking; temporary status will be updated to deposit due
      operationId: updateBooking
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: id of booking
          required: true
          schema:
            type: integer
        - name: arrival
          in: query
          description: arrival date of booking
          required: true
          schema:
            type: string
            format: date
        - name: balance_due_date
          in: query
          description: balance due date of booking
          required: true
          schema:
            type: string
            format: date
        - name: booking_net
          in: query
          description: net booking amount before taxes and fees
          required: true
          schema:
            type: number
            format: double
        - name: damage_deposit_amount
          in: query
          description: damage deposit amount to collect
          required: false
          schema:
            type: integer
            default: 0
        - name: damage_deposit_mode_id
          in: query
          description: >-
            integer representing damage deposit setting to apply [1-4]
          required: false
          schema:
            type: integer
            default: 0
        - name: deposit_due_date
          in: query
          description: deposit due date of booking
          required: true
          schema:
            type: string
            format: date
        - name: deposit_percentage
          in: query
          description: percentage of net booking amount required for deposit
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: guest_id
          in: query
          description: guest_id, will be used if supplied and greater than zero before guest_email 
          required: false
          schema:
            type: integer
        - name: guest_email
          in: query
          description: guest email address
          required: true
          schema:
            type: string
        - name: is_direct_vacations
          in: query
          description: whether to register as DirectVactaions or allura booking
          required: false
          schema:
            type: boolean
            default: false
        - name: nights
          in: query
          description: number of nights of booking
          required: true
          schema:
            type: integer
        - name: notes_owner
          in: query
          description: notes from owner
          required: true
          schema:
            type: string
            maxLength: 1000
        - name: party_size_adults
          in: query
          description: number of guests excluding children
          required: true
          schema:
            type: integer
        - name: party_size_kids
          in: query
          description: number of child guests excluding adults
          required: true
          schema:
            type: integer
        - name: surcharge_ids
          in: query
          description: include ids to add cleaning fees [surcharge_ids=1] and/or pet fees [surcharge_ids=2]
          required: false
          schema:
            type: string
            default: ""
        - name: surcharge_amount_cleaning
          in: query
          description: cleaning surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: surcharge_amount_pets
          in: query
          description: pet surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: marketing_emails
          in: query
          description: guest opt-in for marketing emails; default is false
          required: false
          schema:
            type: boolean

        - name: allura_offer_id
          in: query
          description: allura offers section offer id, to access Allura offer
          required: false
          schema:
            type: integer
        - name: allura_offer_code
          in: query
          description: allura offer code, to access Allura private offer
          required: false
          schema:
            type: string
        - name: owner_offer_id
          in: query
          description: owner offers section offer id, to access Owner offer
          required: false
          schema:
            type: integer
        - name: owner_offer_code
          in: query
          description: owner offer code, to access Owner private offer
          required: false
          schema:
            type: string
        - name: owner_gift_certificate_id
          in: query
          description: owner gift certificates section id, to access Owner Gift Certificate
          required: false
          schema:
            type: integer
        - name: owner_gift_certificate_code
          in: query
          description: owner gift certificate code, to access Owner private Gift Certificate
          required: false
          schema:
            type: string
        - name: allura_gift_certificate_id
          in: query
          description: allura gift certificates section id, to access allura Gift Certificate
          required: false
          schema:
            type: integer
        - name: allura_gift_certificate_code
          in: query
          description: allura gift certificate code, to access allura private Gift Certificate
          required: false
          schema:
            type: string

      responses:
        200:
          description: >-
            returns JSON object with Booking object in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

    delete:
      summary: delete a booking
      operationId: bookingDelete
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: booking id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: >-
            returns JSON object with deleted Booking id in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /booking/cancel/:
    get:
      summary: get booking refund info for Owner for a cancellation based on property settings or custom input
      operationId: getCancellationRefundOwner
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: booking id
          required: true
          schema:
            type: integer
        - name: amount
          in: query
          description: owners can submit a value to override the amount_calculated returned in Booking.Refund, note amount submitted must be between amount_actual and amount_maximum; if submitted refund_percentage will be ignored
          required: false
          schema:
            type: integer
        - name: reason_id
          in: query
          description: owner selects reason for cancellation; defaults to Other
          required: false
          schema:
            type: integer
        - name: refund_percentage
          in: query
          description: owners can submit a custom refund_percentage that is between minimum percentage based on cancellation policy, and 100% 
          required: false
          schema:
            type: integer
        - name: notes_to_allura
          in: query
          description: owners can submit a note to allura about cancellation reasons so some fees may be waived 
          required: false
          schema:
            type: string
        - name: notes_to_guest
          in: query
          description: owners can submit a note to the guest about this cancellation 
          required: false
          schema:
            type: string
      responses:
        200:
          description: >-
            returns JSON object with Booking.Refund object and Booking.Refund.Reason array in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
    post:
      summary: create booking refund for a cancellation based on property settings or custom input
      operationId: createCancellationRefundOwner
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: booking id
          required: true
          schema:
            type: integer
        - name: amount
          in: query
          description: owners can submit a value to override the amount_calculated returned in Booking.Refund, note amount submitted must be between amount_actual and amount_maximum; if submitted refund_percentage will be ignored
          required: false
          schema:
            type: integer
        - name: reason_id
          in: query
          description: owner selects reason for cancellation; defaults to Other
          required: false
          schema:
            type: integer
        - name: refund_percentage
          in: query
          description: owners can submit a custom refund_percentage that is between minimum percentage based on cancellation policy, and 100% 
          required: false
          schema:
            type: integer
        - name: notes_to_allura
          in: query
          description: owners can submit a note to allura about cancellation reasons so some fees may be waived 
          required: false
          schema:
            type: string
        - name: notes_to_guest
          in: query
          description: owners can submit a note to the guest about this cancellation 
          required: false
          schema:
            type: string
      responses:
        200:
          description: >-
            returns JSON object with Booking.Refund object and Booking.Refund.Reason array in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
    put:
      summary: owner acknowledges and can update booking refund before 48 hour expiry period
      operationId: acknowledgeCancellationRefundOwner
      tags:
        - booking
      parameters:
        - name: id
          in: query
          description: booking id
          required: true
          schema:
            type: integer
        - name: amount
          in: query
          description: owners can submit a value to override the amount_calculated returned in Booking.Refund, note amount submitted must be between amount_actual and amount_maximum; if submitted refund_percentage will be ignored
          required: false
          schema:
            type: integer
        - name: refund_percentage
          in: query
          description: owners can submit a custom refund_percentage that is between minimum percentage based on cancellation policy, and 100% 

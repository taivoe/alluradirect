          schema:
            type: string
        - name: owner_gift_certificate_id
          in: query
          description: owner gift certificates section id, to access Owner Gift Certificate
          required: false
          schema:
            type: integer
        - name: owner_gift_certificate_code
          in: query
          description: owner gift certificate code, to access Owner private Gift Certificate
          required: false
          schema:
            type: string
        - name: allura_gift_certificate_id
          in: query
          description: allura gift certificates section id, to access allura Gift Certificate
          required: false
          schema:
            type: integer
        - name: allura_gift_certificate_code
          in: query
          description: allura gift certificate code, to access allura private Gift Certificate
          required: false
          schema:
            type: string
      responses:
        200:
          description: >-
            returns JSON object with Booking object in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:

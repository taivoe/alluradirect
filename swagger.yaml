  /sendquote/:
    post:
      summary: send search results to selected properties
      operationId: sendquote
      tags:
        - sendquote
      parameters:
        - name: start
          in: query
          description: >-
            Search for booking availability, used in conjunction with end date,
            the beginning of an availability search
            date range that returns ARI data for 31 days for available
            properties authorized to User
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
          description: >-
            Used in conjuction with start date (and possibly nights) to query
            server for bookable availability. If no nights parameter provided,
            nights will default to dateDiff(start,end)
        - name: guest_email
          in: query
          required: true
          schema:
            type: string
        - name: guest_emails
          in: query
          required: true
          schema:
            type: string

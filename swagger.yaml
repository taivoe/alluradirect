  /tapechart/:
    get:
      summary: get 31 days of tape chart data
      operationId: tapechart
      tags:
        - tapechart
      parameters:
        - name: property_manager_id
          in: query
          description: property manager id
          required: true
          schema:
            type: integer
        - name: start
          in: query
          description: >-
            Beginning of 31 days of tape chart ARI (availability, rates and
            inventory) data for all properties authorized by User; or, if used
            in conjunction with end date, the beginning of an availability search
            date range that returns ARI data for 31 days for available
            properties authorized to User
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >-
            Used in conjuction with start date (and possibly nights) to query
            server for bookable availability. If no nights parameter provided,
            nights will default to dateDiff(start,end)
          allowEmptyValue: false
        - name: nights
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Number of nights to search for availability, used in conjunction
            with start date and end date to produce an EXACT date search
            (if nights == dateDiff(start,end) ) or a FLEX date search
            (if nights < dateDiff(start,end) )
      responses:
        200:
          description: >-
            returns JSON object with Development array with nested Property arrays,
            Property with nested Booking array and nested Date array (31 days
            from Start); Date includes Event array, Season with nested Rates,
            and availability states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"


  /booking/quote/:
    get:
      summary: get booking quote
      operationId: bookingQuote
      tags:
        - booking
      parameters:
        - name: property_id
          in: query
          description: property id of booking
          required: true
          schema:
            type: integer
        - name: arrival
          in: query
          description: arrival date of booking
          required: true
          schema:
            type: string
            format: date
        - name: nights
          in: query
          description: number of nights of booking
          required: true
          schema:
            type: integer
        - name: price_per_night
          in: query
          description: DEPRECATED (used by TapeChart, use of booking_net for custom amounts preferred) - price per night of booking<br/> - superceded by booking_net<br/> - if included, multiplies against number of nights, otherwise property setting applies
          required: false
          schema:
            type: integer
        - name: booking_net
          in: query
          description: net booking amount before taxes and fees<br/> - if included, takes precedence over price_per_night and property settings
          required: false
          schema:
            type: number
            format: double
        - name: damage_deposit_amount
          in: query
          description: damage deposit collected with booking<br/> - if included, adds to gross_payable returned, otherwise property setting applies
          required: false
          schema:
            type: integer
        - name: damage_deposit_mode_id
          in: query
          description: >-
            integer representing damage deposit setting to apply [0-4]<br>
            0 - no damage deposit required<br>
            1 - charge separately before arrival<br>
            2 - collect with deposit payment<br>
            3 - collect with balance payment<br>
            4 - upon departure if property is damaged
          required: false
          schema:
            type: integer
            default: 4
        - name: surcharge_ids
          in: query
          description: include ids to add cleaning fees [surcharge_ids=1] and/or pet fees [surcharge_ids=2]
          required: false
          schema:
            type: string
            default: ""
        - name: surcharge_amount_cleaning
          in: query
          description: cleaning surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: surcharge_amount_pets
          in: query
          description: pet surcharge amount, can be custom, or defaults to property setting if not included
          required: false
          schema:
            type: integer
        - name: party_size_adults
          in: query
          description: number of guests excluding children
          required: false
          schema:
            type: integer
        - name: party_size_kids
          in: query
          description: number of child guests excluding adults
          required: false
          schema:
            type: integer
        - name: deposit_percentage
          in: query
          description: percentage of net payable due with deposit payment
          required: false
          schema:
            type: integer
        - name: guest_id
          in: query
          description: guest_id, will be used if supplied and greater than zero before guest_email 
          required: false
          schema:
            type: integer
        - name: guest_email
          in: query
          description: email of the guest, required if any allura_offer_id, allura_offer_code, owner_offer_code, allura_gift_certificate_code, owner_gift_certificate_code is included
          required: false
          schema:
            type: string
        - name: guest_first_name
          in: query
          description: first name of the guest
          required: false
          schema:
            type: string
        - name: guest_last_name
          in: query
          description: last name of the guest
          required: false
          schema:
            type: string
        - name: guest_phone
          in: query
          description: phone number of the guest
          required: false
          schema:
            type: string
        - name: notes_owner
          in: query
          description: owner notes, max 1000 characters
          required: false
          schema:
            type: string
        - name: is_direct_vacations
          in: query
          description: allura or direct vacations label booking, default false
          required: false
          schema:
            type: boolean
        - name: id
          in: query
          description: >-
            booking id, use for Booking Editor on existing bookings
            to maintain Paid to Date amounts
          required: false
          schema:
            type: integer

        - name: allura_offer_id
          in: query
          description: allura offers section offer id, to access Allura offer
          required: false
          schema:
            type: integer
        - name: allura_offer_code
          in: query
          description: allura offer code, to access Allura private offer
          required: false
          schema:
            type: string
        - name: owner_offer_id
          in: query

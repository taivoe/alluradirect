      tags:
        - property
      parameters:
        - name: id
          in: query
          description: id of property
          required: true
          schema:
            type: integer
        - name: page_direction
          in: query
          description: future or past bookings; if blank or not provided, defaults to 'future' and loads ALL future bookings (no pagination); all loads from future backwards

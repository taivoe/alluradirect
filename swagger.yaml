        - name: property_ids
          in: query
          required: true
          schema:
            type: string
          description: >-
            selected property id(s) in csv format to send in search result
        - name: nights
          in: query
          schema:
            type: integer
          description: >-
            Number of nights to search for availability, used in conjunction
            with start date and end date to produce an EXACT date search
            (if nights == dateDiff(start,end) ) or a FLEX date search
            (if nights < dateDiff(start,end) )
      responses:
        200:
          description: >-
            returns JSON object with success message in DATA element

          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
    put:
      summary: create or save an Owner-created Offer
      operationId: saveOwnerOffer
      tags:
        - owner
      parameters:
        - name: id
          in: query
          description: owner id
          required: true
          schema:
            type: integer
        - name: property_id
          in: query
          description: property id
          required: true
          schema:
            type: integer
        - name: offer_id
          in: query
          description: offer id, use 0 to create a new offer
          required: true
          schema:
            type: integer
        - name: offer_availability_id
          in: query
          description: offer availability id - allguests 1, repeatguests 2, specificguest 3
          required: true
          schema:
            type: integer
        - name: offer_type_id
          in: query
          description: offer type id, - percentage 1, dollar 2, freenights 3
          required: true
          schema:
            type: integer
        - name: is_enabled
          in: query
          description: whether this Offer is enabled, defaults to true
          required: false
          schema:
            type: boolean
        - name: is_promoted
          in: query
          description: whether this is an allura-only offer or one we invite Owners to join
          required: true
          schema:
            type: boolean
        - name: is_all_properties
          in: query
          description: whether this is an allura-only offer or one we invite Owners to join
          required: true
          schema:
            type: boolean
        - name: code
          in: query
          description: offer code to redeem non-public offers
          required: true
          schema:
            type: string

        - name: guest_id
          in: query
          description: guest id, to restrict offer to a single guest; this will be used before guest_email; required only if offer_availability_id==3 specific guest
          required: false
          schema:
            type: integer
        - name: guest_email
          in: query
          description: guest email, to restrict offer to a single guest; required only if offer_availability_id==3 specific guest
          required: false
          schema:
            type: string
        - name: dollar
          in: query
          description: required if offer_type_id==2 dollar
          required: false
          schema:
            type: integer
        - name: nights_free
          in: query
          description: required if offer_type_id==3 freenights
          required: false
          schema:
            type: integer
        - name: nights_required
          in: query
          description: required if offer_type_id==3 freenights
          required: false
          schema:
            type: integer
        - name: percentage
          in: query
          description: required if offer_type_id==1 percentage
          required: false
          schema:
            type: integer
        - name: offer_start
          in: query
          description: date on or after which offer booking can start to be eligible for offer, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_end
          in: query
          description: date on or before which booking must end to be eligible for offer, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_available_start
          in: query
          description: date on or after which an offer is visible to guests, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: offer_available_end
          in: query
          description: date on or before which an offer is visible to guests, optional, or empty string if unused
          required: false
          schema:
            type: string
            format: date
        - name: property_ids
          in: query
          description: required if is_all_properties==false, a csv list of integer property ids
          required: false
          schema:
            type: string
        - name: blackout_periods
          in: query
          description: if provided, will restrict Offer availability; submit array of Rates.OFfer.BlackoutPeriod, which is [{start:'<date>',end:'<date>',...}] with dates in yyyy-mm-dd format
          required: false
          schema:
            type: string
        - name: description
          in: query
          description: if provided, will persist gift certification redemption description, note this field will publicly visible
          required: false
          schema:
            type: string
        - name: instructions
          in: query
          description: if provided, will persist gift certification redemption instructions, note this field will be private and only viewed by eligible guests
          required: false
          schema:
            type: string
        - name: max_usage_count
          in: query
          description: if provided, this offer will only be claimable by this number of guests
          required: false
          schema:
            type: integer
        - name: distribution_id
          in: query
          description: required for gift certificate type, sets when offer details/voucher will be delivered by email
          required: false
          schema:
            type: integer
        - name: gift_certificate_url
          in: query
          description: file attachment object in base64, if uploaded; if this is an edit, then blank string here will delete, and string 'existing_gift_certificate_url' will preserve existing file
          required: false
          schema:
            type: string
      responses:
        200:
          description: >-
            returns JSON object with array of Rates.Offer.Owner in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"


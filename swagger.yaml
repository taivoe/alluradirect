  /guest/bookings/:
    get:
      summary: get a guest's sparse bookings
      operationId: getGuestBookings
      tags:
        - guest
      parameters:
        - name: id
          in: query
          description: guest id
          required: true
          schema:
            type: integer
        - name: page_direction
          in: query
          description: future or past bookings; if blank or not provided, defaults to 'future' and loads ALL future bookings (no pagination); all loads from future backwards
          required: true
          schema:
            type: string
            pattern: (future|past|all)
        - name: amount_per_page
          in: query
          description: number of records per page, more than zero
          required: true
          schema:
            type: integer
        - name: page
          in: query
          description: pagination page, start at 1 and increment
          required: true
          schema:
            type: integer
        - name: status_id
          in: query
          description: optional filter, status_id (1-reservation request, 2- deposit paid/due, 3-balance paid, 4- cancelled); if not submitted, returns active bookings (statuses 2 & 3)
          required: false
          schema:
            type: integer
            pattern: ([1-4])
      responses:
        200:
          description: >-
            returns JSON object with array of sparse Bookings (TODO: DTO to be made, below) in DATA element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  /guest/booking/payment/:
    post:
      summary: make the next payment due for a guest booking
      operationId: doBookingPayment
      tags:
        - guest
      parameters:
        - name: id
          in: query
          description: guest id
          required: true
          schema:
            type: integer
        - name: booking_id
          in: query
          description: booking id
          required: true
          schema:
            type: integer
        - name: booking_type
          in: query
          description: type of booking object to return, sparse or full (depending on what screen payment launched from), defaults to full
          required: false
          schema:
            type: string
            pattern: (full|sparse)
        - name: cardholder_name
          in: query
          description: payment credit cardholder name
          required: true
          schema:
            type: string
        - name: stripe_credit_card_brand
          in: query
          description: payment credit card brand
          required: true
          schema:
            type: string
        - name: stripe_credit_card_country
          in: query
          description: payment credit card country
          required: true
          schema:
            type: string
        - name: stripe_credit_card_last4
          in: query
          description: payment credit card last 4 digits
          required: true
          schema:
            type: integer
        - name: stripe_credit_card_month
          in: query
          description: payment credit card expiry month
          required: true
          schema:
            type: integer
        - name: stripe_credit_card_token
          in: query
          description: payment credit card tokenized value
          required: true
          schema:
            type: string
        - name: stripe_credit_card_year
          in: query
          description: payment credit card expiry year
          required: true
          schema:
            type: integer
        - name: is_full_payment
          in: query
          description: option to pay the full payment at time booking is made; default false (though based on arrival date payment could still be full)
          required: false
          schema:
            type: boolean
        - name: force_duplicate
          in: query
          description: if HTTP Response Status Code is , use this to force a second transaction on this booking
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: >-
            JSON object with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"


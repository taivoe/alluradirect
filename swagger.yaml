components:
  schemas:
    Address:
      allOf:
        - $ref: "#/components/schemas/Address.Report"
      type: object
      properties:
        id:
          type: integer
        area_id:
          type: integer
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        country_id:
          type: integer
        development_id:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        postal:
          type: string
        region_id:
          type: integer
        resort_id:
          type: integer

    Address.Report:
      type: object
      properties:
        id:
          type: integer
        area:
          type: string
        city:
          type: string
        country:
          type: string
        development:
          type: string
        region:
          type: string
        resort:
          type: string
        street_number:
          type: string
        unit:
          type: string

    Alert:
      type: object
      required:
        - id
        - user_id
        - user_type_id
        - alert_type_id
        - property_ids
        - size_category_ids
        - allura_direct
        - direct_vacations
        - other_sources
      properties:
        id:
          type: integer
        area:
          type: string
        city:
          type: string
        country:
          type: string
        development:
          type: string
        region:
          type: string
        resort:
          type: string
        street_number:
          type: string
        unit:
          type: string

    Analytics:
      type: object
      required:
        - nights_in_range
        - start_date
        - end_date
        - development_ids
        - property_ids
        - size_category_ids
        - allura_direct
        - direct_vacations
        - other_sources
      properties:
        nights_in_range:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        development_ids:
          type: string
          description: csv list of development ids for use as filters
        property_ids:
          type: string
          description: csv list of property ids for use as filters
        size_category_ids:
          type: string
          description: csv list of size category ids for use as filters
        allura_direct:
          $ref: "#/components/schemas/Analytics.Source"
        direct_vacations:
          $ref: "#/components/schemas/Analytics.Source"
